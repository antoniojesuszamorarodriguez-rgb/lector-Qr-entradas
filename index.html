<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lector QR · Evento solidario</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#f3f6fa;margin:0;color:#1b2430}
    main{max-width:720px;margin:20px auto;padding:16px}
    .card{background:white;border-radius:16px;padding:18px;margin-bottom:16px;border:1px solid #dde5ee}
    input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd5df;border-radius:9px;box-sizing:border-box}
    button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
    .primary{background:#153d6c;color:white}.green{background:#2e9d50;color:white}.secondary{background:#eef3f8}
    #reader{width:100%}.result{padding:18px;border-radius:12px;font-size:22px;text-align:center;font-weight:800;margin-top:14px}
    .ok{background:#e6f7eb}.warn{background:#fff3d6}.bad{background:#fde7e7}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Control de acceso</h1>
    <label>URL de Apps Script (/exec)</label>
    <input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <label>PIN administrador</label>
    <input id="pin" type="password">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="secondary" onclick="testConnection()">Probar conexión</button>
      <button class="green" onclick="startScanner()">📷 Abrir cámara</button>
      <button class="secondary" onclick="stopScanner()">Detener</button>
    </div>
    <div id="connection"></div>
  </div>

  <div class="card">
    <div id="reader"></div>
    <div id="result"></div>
  </div>
</main>

<script>
let qr=null, lastToken='', lastTime=0;
const $=id=>document.getElementById(id);

window.addEventListener('load',()=>{
  $('apiUrl').value=localStorage.getItem('solidaria_api_url')||'';
});

function apiBase(){
  const v=$('apiUrl').value.trim();
  localStorage.setItem('solidaria_api_url',v);
  return v.replace(/\?.*$/,'').replace(/\/$/,'');
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const base=apiBase();
    if(!base) return reject(new Error('Escribe la URL /exec de Apps Script.'));
    const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const script=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('No se pudo contactar con Apps Script.'));},12000);
    function cleanup(){clearTimeout(timer);delete window[cb];script.remove();}
    window[cb]=data=>{cleanup();resolve(data);};
    const qs=new URLSearchParams({...params,callback:cb});
    script.src=base+'?'+qs.toString();
    script.onerror=()=>{cleanup();reject(new Error('Error de conexión con Apps Script.'));};
    document.body.appendChild(script);
  });
}

async function testConnection(){
  try{
    const r=await jsonp({api:'ping'});
    $('connection').innerHTML='<div class="result ok">✅ '+escapeHtml(r.message||'Conexión correcta')+'</div>';
  }catch(e){$('connection').innerHTML='<div class="result bad">❌ '+escapeHtml(e.message)+'</div>';}
}

async function startScanner(){
  try{
    if(qr) await stopScanner();
    qr=new Html5Qrcode('reader');
    const cams=await Html5Qrcode.getCameras();
    if(!cams.length) throw new Error('No se encontró ninguna cámara.');
    const preferred=cams.find(c=>/back|rear|environment|trasera/i.test(c.label))||cams[cams.length-1];
    await qr.start(
      preferred.id,
      {fps:10,qrbox:{width:250,height:250}},
      onScan,
      ()=>{}
    );
  }catch(e){
    $('result').innerHTML='<div class="result bad">❌ '+escapeHtml(e.message)+'</div>';
  }
}

async function stopScanner(){
  if(qr){
    try{await qr.stop();}catch(e){}
    try{await qr.clear();}catch(e){}
    qr=null;
  }
}

async function onScan(decodedText){
  const now=Date.now();
  if(decodedText===lastToken && now-lastTime<3000) return;
  lastToken=decodedText; lastTime=now;

  try{
    const r=await jsonp({api:'checkin',pin:$('pin').value,token:decodedText});
    if(!r.valid){
      show('bad','❌ '+(r.message||'Entrada no válida'));
    }else if(r.alreadyUsed){
      show('warn','⚠️ ENTRADA YA UTILIZADA<br>Fila '+r.row+' · Butaca '+r.seat);
    }else{
      show('ok','✅ ENTRADA VÁLIDA<br>Fila '+r.row+' · Butaca '+r.seat);
      if(navigator.vibrate) navigator.vibrate(120);
    }
  }catch(e){show('bad','❌ '+e.message);}
}

function show(cls,html){$('result').innerHTML='<div class="result '+cls+'">'+html+'</div>';}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
